<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e0d12">
<title>סטודיו AR</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body data-view="home" data-pane="layers">

<!-- the gallery -->
<div id="home">
  <header class="home-top">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span class="brand-name">סטודיו AR</span></div>
    <div class="home-actions">
      <button id="btn-import" type="button" class="btn ghost" data-ic="upload" data-size="18"><span>פתיחת גיבוי</span></button>
      <button id="btn-new" type="button" class="btn primary" data-ic="plus" data-size="18"><span>יצירה חדשה</span></button>
    </div>
  </header>
  <main class="home-main">
    <div class="home-title"><h1>היצירות שלי</h1><span id="home-count"></span></div>
    <div id="home-grid" class="grid" hidden></div>
    <section id="home-empty" hidden>
      <div class="empty-art" aria-hidden="true"><i></i><i></i><i></i></div>
      <h2>יצירה שמתעוררת לחיים</h2>
      <p>מעלים תמונה של יצירה, מניחים מעליה סרטון, טקסט, צליל או דמות תלת־ממדית, ומכוונים אליה את המצלמה.</p>
      <div class="empty-actions">
        <button id="btn-new-empty" type="button" class="btn primary big" data-ic="plus"><span>יצירה חדשה</span></button>
        <button id="btn-sample" type="button" class="btn ghost big" data-ic="sparkle"><span>לראות דוגמה</span></button>
      </div>
    </section>
  </main>
</div>

<!-- one creation -->
<div id="editor" hidden>
  <header id="topbar">
    <button id="btn-back" type="button" class="icon-btn" title="לכל היצירות" aria-label="לכל היצירות" data-ic="back"></button>
    <input id="rec-name" type="text" maxlength="60" aria-label="שם היצירה" autocomplete="off">
    <span id="save-pill" data-state="saved">נשמר</span>
    <span class="grow"></span>
    <button id="btn-undo" type="button" class="icon-btn" title="ביטול" aria-label="ביטול" data-ic="undo" disabled></button>
    <button id="btn-redo" type="button" class="icon-btn" title="החזרה" aria-label="החזרה" data-ic="redo" disabled></button>
    <button id="btn-preview" type="button" class="btn ghost top-btn" title="לראות איך זה ייראה" aria-label="תצוגה" data-ic="eye" data-size="18"><span>תצוגה</span></button>
    <button id="btn-share" type="button" class="btn primary top-btn" aria-label="לראות ולשתף" data-ic="share" data-size="18"><span>לראות ולשתף</span></button>
  </header>

  <aside id="layers-pane" aria-label="שכבות">
    <div class="pane-head">
      <h2>שכבות <span id="layer-count"></span></h2>
      <button id="btn-add" type="button" class="btn primary small" data-ic="plus" data-size="18"><span>הוספה</span></button>
    </div>
    <div id="layer-list" role="listbox" aria-label="שכבות, העליונה ראשונה"></div>
    <div id="art-card" hidden></div>
  </aside>

  <section id="stage" aria-label="היצירה">
    <div id="canvas-wrap"><canvas id="preview"></canvas></div>
    <div id="stage-empty" hidden>
      <div class="empty-art small" aria-hidden="true"><i></i><i></i><i></i></div>
      <h2>מתחילים בתמונה של היצירה</h2>
      <p>זו התמונה שהמצלמה תזהה. צילום ישר וחד, בלי השתקפויות.</p>
      <button id="btn-empty-art" type="button" class="btn primary big" data-ic="upload"><span>העלאת תמונה</span></button>
    </div>
    <div id="stage-art" hidden>
      <p id="stage-art-text"></p>
      <button id="btn-art-retry" type="button" class="btn primary" data-ic="redo" data-size="18"><span>לנסות שוב</span></button>
      <button id="btn-art-replace" type="button" class="btn ghost" data-ic="upload" data-size="18"><span>להעלות אותה שוב</span></button>
    </div>
    <div id="sel-bar" hidden></div>
    <div id="time-chip" hidden><span id="time-chip-text"></span><button id="btn-time-live" type="button" data-ic="play" data-size="14"><span>ניגון</span></button></div>
    <div id="stage-tools" hidden>
      <div class="seg" role="group" aria-label="מבט">
        <button id="btn-2d" type="button" class="on" aria-pressed="true">שטוח</button>
        <button id="btn-3d" type="button" aria-pressed="false">תלת־ממד</button>
      </div>
      <button id="btn-snap" type="button" class="icon-btn on" aria-pressed="true" title="הצמדה למרכז ולקצוות" aria-label="הצמדה למרכז ולקצוות" data-ic="magnet" data-size="18"></button>
      <div class="seg zoom" role="group" aria-label="זום" dir="ltr">
        <button id="btn-zoom-out" type="button" title="להתרחק" aria-label="להתרחק" data-ic="zoomOut" data-size="18"></button>
        <button id="zoom-label" type="button" title="חזרה ל־100%">100%</button>
        <button id="btn-zoom-in" type="button" title="להתקרב" aria-label="להתקרב" data-ic="zoomIn" data-size="18"></button>
      </div>
    </div>
  </section>

  <nav id="tabs" role="tablist" aria-label="מה עורכים"></nav>
  <aside id="inspector" aria-label="הגדרות"></aside>
</div>

<script src="library.js?v=rc126"></script>
<script src="vendor/gifanim.js"></script>
<script src="actions.js?v=rc94"></script>
<script crossorigin="anonymous" src="./external/scripts/8frame-1.5.0.min.js"></script>
<script src="shared.js?v=rc94"></script>
<script src="vendor/fflate.umd.js"></script>
<script src="vendor/gltfzip.js"></script>
<script src="vendor/fbx-import.js"></script>
<script src="vendor/obj2glb.js"></script>
<script src="editor-3d.js?v=rc94"></script>
<script src="app/ui.js?v=rc94"></script>
<script src="app/store.js?v=rc94"></script>
<script src="app/stage.js?v=rc94"></script>
<script src="app/layers.js?v=rc94"></script>
<script src="app/timeline.js?v=rc94"></script>
<script src="app/inspector.js?v=rc94"></script>
<script src="app/home.js?v=rc94"></script>
<script src="app/share.js?v=rc94"></script>
<script src="app/main.js?v=rc94"></script>
</body>
</html>
