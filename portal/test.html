<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>בדיקת AR — תמונת טריגר</title>
<link rel="stylesheet" href="./fonts/fonts.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; font-family: system-ui, sans-serif; background: #111; color: #eee; }
  #container { position: fixed; inset: 0; overflow: hidden; }
  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
             justify-content: center; gap: 14px; background: #1f4e5f; z-index: 20; text-align: center; padding: 24px; }
  .overlay p { color: #cfe2ea; max-width: 420px; line-height: 1.5; }
  .overlay img { max-height: 30vh; border-radius: 10px; border: 2px solid #d4ac0d; }
  button, a.btn { font-size: 1rem; padding: 12px 24px; border: 0; border-radius: 26px; background: #d4ac0d;
           color: #1f2733; font-weight: 700; cursor: pointer; text-decoration: none; }
  #status { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 10;
            background: rgba(0,0,0,.55); padding: 7px 16px; border-radius: 16px; display: none; }
</style>
</head>
<body>
<div class="overlay" id="startOverlay">
  <h1>בדיקת AR</h1>
  <p id="itemTitle"></p>
  <img id="triggerThumb" alt="">
  <p>הציגו את תמונת הטריגר על מסך אחר (או בהדפסה) וכוונו אליה את המצלמה.</p>
  <button id="startBtn">התחלת בדיקה</button>
  <a class="btn" id="backBtn" href="./index.html" style="background:transparent; color:#d4ac0d; border:2px solid #d4ac0d;">חזרה</a>
</div>
<div id="container"></div>
<div id="status">מחפש את תמונת הטריגר…</div>

<script type="importmap">
{ "imports": { "three": "../spike/vendor/three.module.js", "three/addons/": "../spike/vendor/three/addons/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { MindARThree } from '../spike/vendor/mindar-image-three.prod.js';
import { store } from './js/store.js';
import { buildElements, updateAnimations, elementLabel } from './js/elements.js';
import { createStabilizer } from './js/stabilizer.js';

window.__test = { loaded: false, started: false, targetFound: false, error: '' };
const $ = (id) => document.getElementById(id);

const id = new URLSearchParams(location.search).get('id');
const item = id ? await store.getItem(id) : null;
if (!item) {
  $('itemTitle').textContent = 'תמונת הטריגר לא נמצאה';
  $('startBtn').style.display = 'none';
  window.__test.error = 'item not found';
} else {
  const kinds = (item.elements || []).map((e) => elementLabel(e.kind)).join(' + ');
  $('itemTitle').textContent = `"${item.title}" — ${kinds}`;
  $('triggerThumb').src = store.fileUrl(item, 'image');
  window.__test.loaded = true;
}

async function buildContent(anchor) {
  // trigger aspect: stored at upload time; fall back to measuring the image itself
  let triggerH = item.imageH && item.imageW ? item.imageH / item.imageW : null;
  if (!triggerH) {
    const probe = new Image();
    probe.crossOrigin = 'anonymous';
    probe.src = store.fileUrl(item, 'image');
    await probe.decode().catch(() => {});
    triggerH = probe.height && probe.width ? probe.height / probe.width : 1.4;
  }

  const { group, videos, mixers, anims } = await buildElements(
    THREE, item.elements, (el) => store.elementUrl(item, el), triggerH,
  );
  group.userData.anims = anims;

  let audio;
  const audioUrl = store.fileUrl(item, 'audio');
  if (audioUrl) {
    audio = new Audio(audioUrl);
    audio.loop = true;
  } else {
    // no dedicated soundtrack: let the first video carry its own sound
    if (videos[0]) videos[0].muted = false;
  }

  const onFound = () => {
    videos.forEach((v) => v.play().catch(() => {}));
    audio?.play().catch(() => {});
  };
  const onLost = () => {
    videos.forEach((v) => v.pause());
    audio?.pause();
  };

  group.userData.mixers = mixers;
  anchor.group.add(group);
  return { group, onFound, onLost };
}

$('startBtn').addEventListener('click', async () => {
  try {
    $('startOverlay').style.display = 'none';
    $('status').style.display = 'block';
    const mindarThree = new MindARThree({
      container: $('container'),
      imageTargetSrc: store.fileUrl(item, 'mind'),
      uiScanning: 'no', uiLoading: 'no', uiError: 'no',
      filterMinCF: 0.0005,
      filterBeta: 1000,
      warmupTolerance: 3,
      missTolerance: 8,
    });
    const { renderer, scene, camera } = mindarThree;
    const anchor = mindarThree.addAnchor(0);
    const { group, onFound, onLost } = await buildContent(anchor);
    const holder = new THREE.Group();
    holder.visible = false;
    // reparent content from the raw anchor into the stabilized holder
    anchor.group.remove(group);
    holder.add(group);
    scene.add(holder);
    const stabilizer = createStabilizer(THREE);

    anchor.onTargetFound = () => {
      window.__test.targetFound = true;
      $('status').textContent = 'תמונת הטריגר זוהתה ✓';
      onFound();
    };
    anchor.onTargetLost = () => { $('status').textContent = 'מחפש את תמונת הטריגר…'; onLost(); };

    await mindarThree.start();
    window.__test.started = true;
    const clock = new THREE.Clock();
    let elapsed = 0;
    renderer.setAnimationLoop(() => {
      const dt = clock.getDelta();
      elapsed += dt;
      group.userData.mixers?.forEach((m) => m.update(dt));
      updateAnimations(group.userData.anims || [], elapsed);
      stabilizer.update(holder, anchor.group);
      renderer.render(scene, camera);
    });
  } catch (e) {
    window.__test.error = String(e.stack || e);
    $('status').style.display = 'block';
    $('status').textContent = 'שגיאה: ' + e;
  }
});
</script>
</body>
</html>
